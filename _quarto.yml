project:
  type: book
  execute-dir: project
  output-dir: _book

book:
  title: "Open Labs"
  subtitle: "Scaling curves, experiments, and final runs at open AI labs"
  author: "METR (internal reference)"
  date: today
  chapters:
    - index.qmd
    - part: "Part I: Pretraining scaling"
      chapters:
        - chapters/10-reference-suites.qmd
        - chapters/11-marin.qmd
        - chapters/12-olmo.qmd
    - part: "Part II: Post-training and RL scaling"
      chapters:
        - chapters/20-prime-intellect.qmd
    - part: "Synthesis"
