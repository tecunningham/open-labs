# Render the Quarto book and publish it to GitHub Pages.
# Requires: repo Settings -> Pages -> Source = "GitHub Actions" (one-time, done in the UI).
name: Publish book

on:
  push:
    # The default branch. The old name stays listed so the workflow still fires if
    # this change lands before the branch is renamed to main.
    branches: [main, claude/elegant-mccarthy-zijd0e]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install --disable-pip-version-check -r requirements.txt

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.32

      # No _freeze/ is committed, so every chapter executes from the CSVs on each run.
      - run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
